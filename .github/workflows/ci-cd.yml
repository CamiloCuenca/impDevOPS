name: CI/CD Pipeline - VitalApp (All Branches)

on:
  push:
    branches: '**'  # Se ejecuta en todas las ramas al hacer push
  pull_request:
    branches: '**'  # Se ejecuta en PRs de cualquier rama

env:
  IMAGE_NAME: vitalapp

jobs:
  test-and-build:
    name: Ejecutar pruebas y construir imagen
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar Node.js (con caché)
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar ESLint (solo warnings)
        run: |
          npm run lint || echo "ESLint encontró warnings, pero el pipeline continúa"
          # Guardar reporte como artefacto (opcional)
          npm run lint > eslint-report.txt 2>&1 || true

      - name: Subir reporte de ESLint (opcional)
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: eslint-report-${{ github.ref_name }}  # Nombre único por rama
          path: eslint-report.txt

      - name: Ejecutar pruebas con Jest
        run: npm test

      - name: Construir imagen Docker
        run: docker build -t $IMAGE_NAME-${{ github.ref_name }} .  # Tag por rama

  deploy-to-render:
    name: Desplegar en Render
    runs-on: ubuntu-latest
    needs: test-and-build
    # Opcional: Restringir despliegue solo desde main
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Hacer deploy en Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
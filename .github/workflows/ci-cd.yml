name: CI/CD Pipeline - VitalApp (All Branches)

on:
  push:
    branches: ['**']  # Se ejecuta en todas las ramas
  pull_request:
    branches: ['**']

env:
  IMAGE_NAME: vitalapp  # ¡En minúsculas!

jobs:
  test-and-build:
    name: Test + Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: |
          npm run lint || echo "ESLint encontró warnings (no bloqueante)"
          npm run lint > eslint-report.txt 2>&1 || true

      - name: Upload ESLint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eslint-report-${{ github.ref_name }}
          path: eslint-report.txt

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME-deploy-${{ github.ref_name }} .
          echo "Imagen construida: $IMAGE_NAME-deploy-${{ github.ref_name }}"

  deploy-to-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.ref == 'refs/heads/main'  # Solo despliega desde main

    steps:
      - name: Trigger Render deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
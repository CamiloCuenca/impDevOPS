<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VitalApp</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 40px;
      background-color: #f9f9f9;
      color: #333;
    }
    h1 {
      color: #0077cc;
    }
    h2 {
      color: #005a9e;
    }
    button {
      background-color: #0077cc;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      margin: 5px 10px 10px 0;
    }
    button:hover {
      background-color: #005fa3;
    }
    input[type="text"], input[type="date"] {
      padding: 8px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      width: 100%;
      box-sizing: border-box;
    }
    label {
      display: block;
      margin-top: 10px;
    }
    .seccion {
      display: none;
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-top: 20px;
    }
    .visible {
      display: block;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 10px;
      background-color: #fff;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ccc;
      text-align: left;
    }
    th {
      background-color: #0077cc;
      color: white;
    }
    ul {
      margin-top: 10px;
      padding-left: 20px;
    }
    li {
      margin-bottom: 10px;
    }
    .environment-indicator {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background-color: #f0f0f0;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 12px;
      color: #666;
    }
  </style>
  <script>
    // Detección automática del ambiente
    function getApiUrl() {
      const hostname = window.location.hostname;
      if (hostname === 'localhost' || hostname === '127.0.0.1') {
        // Ambiente local - usa la misma URL base
        return '';
      } else {
        // Ambiente de producción - usa la URL de render.com
        return 'https://impdevops.onrender.com';
      }
    }

    const API_URL = getApiUrl();
    
    // Mostrar indicador de ambiente
    window.onload = function() {
      const envIndicator = document.createElement('div');
      envIndicator.className = 'environment-indicator';
      envIndicator.textContent = `Ambiente: ${API_URL || 'Local'}`;
      document.body.appendChild(envIndicator);
    };

    async function agendarCita(event) {
      event.preventDefault();
      const citaData = {
        nombre: document.getElementById('nombre').value,
        cedula: document.getElementById('cedula').value,
        fecha: document.getElementById('fecha').value,
        motivo: document.getElementById('motivo').value
      };

      try {
        const response = await fetch(`${API_URL}/citas`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(citaData)
        });

        const result = await response.json();
        alert(response.ok ? '✅ Cita agendada con éxito' : (result.mensaje || '❌ Hubo un error'));
      } catch (error) {
        console.error("Error al agendar cita:", error);
        alert('❌ Error al conectar con el servidor. Intente nuevamente.');
      }
    }

    async function cargarCitas() {
      const cedula = document.getElementById('consultaCedula').value;
      if (!cedula) {
        alert('Por favor ingrese una cédula para consultar las citas');
        return;
      }

      try {
        const res = await fetch(`${API_URL}/citas?cedula=${cedula}`);
        const data = await res.json();
        const contenedor = document.getElementById('listaCitas');

        if (res.ok && data.citas && data.citas.length > 0) {
          contenedor.innerHTML = ` 
            <table>
              <tr>
                <th>Paciente</th>
                <th>Cédula</th>
                <th>Fecha</th>
                <th>Motivo</th>
              </tr>
              ${data.citas.map(c => `
                <tr>
                  <td>${c.nombre}</td>
                  <td>${c.cedula}</td>
                  <td>${c.fecha}</td>
                  <td>${c.motivo}</td>
                </tr>`).join('')}
            </table>`;
        } else {
          contenedor.innerHTML = `<p>${data.mensaje || 'No se encontraron citas para esta cédula'}</p>`;
        }
      } catch (error) {
        console.error("Error al cargar citas:", error);
        document.getElementById('listaCitas').innerHTML = '<p>❌ Error al conectar con el servidor. Intente nuevamente.</p>';
      }
    }

    async function cargarResultados() {
      const cedula = document.getElementById('consultaCedulaResultados').value;
      if (!cedula) {
        alert('Por favor ingrese una cédula para consultar los resultados');
        return;
      }

      try {
        const res = await fetch(`${API_URL}/resultados?cedula=${cedula}`);
        const data = await res.json();
        const contenedor = document.getElementById('listaResultados');

        if (res.ok && data.resultados && data.resultados.length > 0) {
          contenedor.innerHTML = `
            <table>
              <tr>
                <th>Paciente</th>
                <th>Cédula</th>
                <th>Examen</th>
                <th>Resultado</th>
                <th>Fecha</th>
              </tr>
              ${data.resultados.map(r => `
                <tr>
                  <td>${r.paciente}</td>
                  <td>${r.cedula}</td>
                  <td>${r.examen}</td>
                  <td>${r.resultado}</td>
                  <td>${r.fecha}</td>
                </tr>`).join('')}
            </table>`;
        } else {
          contenedor.innerHTML = `<p>${data.mensaje || 'No se encontraron resultados para esta cédula'}</p>`;
        }
      } catch (error) {
        console.error("Error al cargar resultados:", error);
        document.getElementById('listaResultados').innerHTML = '<p>❌ Error al conectar con el servidor. Intente nuevamente.</p>';
      }
    }

    function mostrarSeccion(id) {
      document.querySelectorAll('.seccion').forEach(div => div.classList.remove('visible'));
      document.getElementById(id).classList.add('visible');
    }
  </script>
</head>
<body>
  <h1>VitalApp</h1>

  <button onclick="mostrarSeccion('agendarCita')">Agendar Cita</button>
  <button onclick="mostrarSeccion('verCitas')">Ver Citas Agendadas</button>
  <button onclick="mostrarSeccion('verResultados')">Ver Resultados Médicos</button>

  <div id="agendarCita" class="seccion visible">
    <h2>Agendar Cita</h2>
    <form onsubmit="agendarCita(event)">
      <label>Nombre:
        <input type="text" id="nombre" required>
      </label>
      <label>Cédula:
        <input type="text" id="cedula" required>
      </label>
      <label>Fecha:
        <input type="date" id="fecha" required>
      </label>
      <label>Motivo:
        <input type="text" id="motivo" required>
      </label>
      <button type="submit">Agendar</button>
    </form>
  </div>

  <div id="verCitas" class="seccion">
    <h2>Citas Agendadas</h2>
    <label>Cédula del paciente:
      <input type="text" id="consultaCedula" required>
    </label>
    <button onclick="cargarCitas()">Consultar</button>
    <div id="listaCitas"></div>
  </div>

  <div id="verResultados" class="seccion">
    <h2>Resultados Médicos</h2>
    <label>Cédula del paciente:
      <input type="text" id="consultaCedulaResultados" required>
    </label>
    <button onclick="cargarResultados()">Consultar</button>
    <div id="listaResultados"></div>
  </div>
</body>
</html>
